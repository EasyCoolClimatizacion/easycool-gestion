<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyCool - Informe Mantenimiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f3f4f6; }
        canvas.signature-pad { cursor: crosshair; touch-action: none; width: 100%; height: 100%; display: block; }
        @media print {
            body { background: white; margin:0; padding:0; font-size: 10px; }
            .no-print { display: none !important; }
            .printable-section { width: 100% !important; margin:0; box-shadow:none !important; border:none!important;}
            .equipment-section { page-break-inside: avoid; border: 1px solid #ddd; margin-bottom: 10px; }
        }
    </style>
</head>
<body class="p-4 sm:p-8">

    <div id="form-section" class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-xl mb-8 no-print border-t-4 border-purple-600">
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-2xl font-bold">Informe de Mantenimiento <span id="fb-status" class="text-xs text-green-500">Conectando...</span></h2>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <input type="text" id="m-cliente" placeholder="Nombre Cliente" class="border p-2 rounded">
            <input type="text" id="m-rut" placeholder="RUT Cliente" class="border p-2 rounded">
            <input type="text" id="m-dir" placeholder="Dirección" class="border p-2 rounded col-span-2">
        </div>

        <div id="equipos-m-container" class="space-y-4 mb-6"></div>
        <button onclick="addEqM()" class="w-full py-3 border-2 border-dashed border-purple-300 text-purple-600 font-bold rounded hover:bg-purple-50 mb-6">+ Agregar Equipo a Revisar</button>

        <div class="grid grid-cols-2 gap-6 border-t pt-4 mb-6">
            <div>
                <p class="text-xs font-bold text-gray-500 mb-2">Firma Técnico</p>
                <div class="h-32 border-2 border-dashed bg-gray-50 relative"><canvas id="pad-tech" class="signature-pad"></canvas></div>
            </div>
            <div>
                <p class="text-xs font-bold text-gray-500 mb-2">Firma Cliente</p>
                <div class="h-32 border-2 border-dashed bg-gray-50 relative"><canvas id="pad-client" class="signature-pad"></canvas></div>
            </div>
        </div>

        <button onclick="genReport()" class="w-full bg-gray-900 text-white font-bold py-4 rounded shadow-lg">Generar y Guardar Informe</button>
    </div>

    <!-- PDF SECTION -->
    <div id="report-section" class="max-w-4xl mx-auto bg-white p-8 shadow-2xl printable-section hidden">
        <header class="flex justify-between items-start border-b-2 border-[#212B3B] pb-4 mb-6">
            <div class="flex flex-row items-center font-montserrat gap-4">
                <div class="relative w-[70px] h-[70px] bg-[#4981F3] rounded-full flex flex-col justify-center items-end pr-[12px] gap-[5px]">
                    <div class="h-[8px] w-[45px] bg-[#F1F6FF] rounded-full"></div>
                    <div class="h-[8px] w-[35px] bg-[#E4EEFF] rounded-full"></div>
                    <div class="h-[8px] w-[25px] bg-[#D2E3FF] rounded-full"></div>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-[#212B3B] font-[900] text-[24px] leading-none mb-1">EASYCOOL</h1>
                    <p class="text-[#9FA5B1] font-[500] text-[12px] leading-none">Climatización</p>
                </div>
            </div>
            <div class="text-right text-[#212B3B]">
                <h1 class="text-sm font-bold mb-1">EasyCool Climatización</h1>
                <p class="text-xs">RUT: 77.448.234-2</p>
                <p class="text-xs">ventas@easycoolclimatizacion.com</p>
                <p class="text-xs">+569 5777 6174</p>
            </div>
        </header>

        <h2 class="text-lg font-bold uppercase mb-4 text-center">Informe Técnico de Mantenimiento</h2>
        <div class="bg-gray-50 p-2 rounded border mb-4">
            <p class="text-sm"><strong>Cliente:</strong> <span id="r-cliente"></span> | <strong>RUT:</strong> <span id="r-rut"></span></p>
        </div>

        <div id="r-equipos"></div>

        <section class="mt-8 pt-8 border-t-2 border-gray-100 flex justify-between text-center page-break-inside-avoid">
            <div class="w-1/3 flex flex-col items-center">
                <img id="img-tech" class="h-20 object-contain mb-1">
                <div class="border-t border-gray-400 w-full pt-1">
                    <p class="text-xs font-bold">José Guerrero</p>
                    <p class="text-[9px] text-gray-500">Técnico | RUT: 15.963.315-2</p>
                </div>
            </div>
            <div class="w-1/3 flex flex-col items-center">
                <img id="img-client" class="h-20 object-contain mb-1">
                <div class="border-t border-gray-400 w-full pt-1">
                    <p class="text-xs font-bold" id="r-sig-name">Cliente</p>
                    <p class="text-[9px] text-gray-500" id="r-sig-rut"></p>
                </div>
            </div>
        </section>

        <div class="mt-8 text-center no-print"><button onclick="window.print()" class="bg-blue-600 text-white font-bold py-2 px-6 rounded">Imprimir PDF</button></div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDEdRinj3nsSy-xgkFAQBuABikw48vB92Y", authDomain: "easycool-cloud.firebaseapp.com", projectId: "easycool-cloud", storageBucket: "easycool-cloud.firebasestorage.app", messagingSenderId: "1088663353920", appId: "1:1088663353920:web:221585b4896c037dfbfda5" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().signInAnonymously().then(()=> document.getElementById('fb-status').innerText='✅ Nube OK').catch(()=> document.getElementById('fb-status').innerText='❌ Error');

    function initPad(id) {
        const c = document.getElementById(id), ctx = c.getContext('2d');
        c.width = c.offsetWidth; c.height = c.offsetHeight;
        let d = false;
        c.onmousedown = c.ontouchstart = (e) => { d=true; ctx.beginPath(); ctx.moveTo(e.offsetX||e.touches[0].clientX-c.getBoundingClientRect().left, e.offsetY||e.touches[0].clientY-c.getBoundingClientRect().top);};
        c.onmousemove = c.ontouchmove = (e) => { if(d){ e.preventDefault(); ctx.lineTo(e.offsetX||e.touches[0].clientX-c.getBoundingClientRect().left, e.offsetY||e.touches[0].clientY-c.getBoundingClientRect().top); ctx.stroke();}};
        c.onmouseup = c.ontouchend = () => d=false;
        return c;
    }
    const pt = initPad('pad-tech'), pc = initPad('pad-client');

    function addEqM() {
        const d = document.createElement('div');
        d.className = 'eq-block p-4 border rounded bg-gray-50';
        d.innerHTML = `<input type="text" class="eq-marca w-full border p-2 mb-2" placeholder="Marca / Ubicación"><textarea class="eq-obs w-full border p-2 h-16 text-sm" placeholder="Observaciones y Diagnóstico..."></textarea>`;
        document.getElementById('equipos-m-container').appendChild(d);
    }
    addEqM();

    async function genReport() {
        const c = document.getElementById('m-cliente').value, r = document.getElementById('m-rut').value;
        document.getElementById('r-cliente').innerText = c;
        document.getElementById('r-rut').innerText = r;
        document.getElementById('r-sig-name').innerText = c || 'Cliente';
        document.getElementById('r-sig-rut').innerText = r || '';

        let html = '', dataEq = [];
        document.querySelectorAll('.eq-block').forEach((el, i) => {
            const m = el.querySelector('.eq-marca').value, o = el.querySelector('.eq-obs').value;
            dataEq.push({marca: m, obs: o});
            html += `<div class="equipment-section p-3 bg-white mb-2"><h3 class="font-bold text-blue-800 text-sm">Equipo #${i+1}: ${m}</h3><p class="text-xs mt-1 text-gray-700 italic">${o}</p></div>`;
        });
        document.getElementById('r-equipos').innerHTML = html;
        document.getElementById('img-tech').src = pt.toDataURL();
        document.getElementById('img-client').src = pc.toDataURL();

        try { await db.collection('mantenimientos').add({ cliente: c, rut: r, equipos: dataEq, date: new Date().toISOString() }); } catch(e){}

        document.getElementById('form-section').style.display = 'none';
        document.getElementById('report-section').style.display = 'block';
    }
</script>
</body>
</html>
