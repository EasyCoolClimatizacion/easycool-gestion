<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EasyCool Operations Hub</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@500;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .btn-tool { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-tool:active { transform: scale(0.96); }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6 flex flex-col items-center justify-center">

    <div class="text-center mb-10 w-full max-w-md flex flex-col items-center">
        <!-- LOGO VECTORIZADO INTACTO -->
        <div class="flex flex-row items-center justify-center font-montserrat select-none gap-4 mb-4">
            <div class="relative w-[70px] h-[70px] bg-[#4981F3] rounded-full flex flex-col justify-center items-end pr-[12px] gap-[5px] shadow-md">
                <div class="h-[9px] w-[42px] bg-[#F1F6FF] rounded-full"></div>
                <div class="h-[9px] w-[34px] bg-[#E4EEFF] rounded-full"></div>
                <div class="h-[9px] w-[25px] bg-[#D2E3FF] rounded-full"></div>
            </div>
            <div class="flex flex-col items-start leading-none mt-1">
                <span class="text-[#212B3B] font-[900] text-[32px] tracking-[-0.01em]">EASYCOOL</span>
                <span class="text-[#9FA5B1] font-[500] text-[15px] tracking-[0.01em] mt-1">Climatización</span>
            </div>
        </div>
        <p class="text-gray-500 text-xs font-bold tracking-widest uppercase mt-2 bg-white px-3 py-1 rounded-full shadow-sm border border-gray-200">Panel Operativo en Terreno</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 w-full max-w-2xl">
        <a href="certificado.html" class="btn-tool group relative overflow-hidden rounded-2xl bg-white p-6 shadow hover:shadow-lg transition-all border-l-4 border-[#4981F3]">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 rounded-full bg-blue-50 flex items-center justify-center text-[#4981F3]"><i class="fas fa-file-signature text-xl"></i></div>
                <div><h3 class="font-bold text-gray-900 text-lg">Certificado Instalación</h3><p class="text-xs text-gray-500 font-medium">Puesta en marcha y firmas</p></div>
                <div class="ml-auto text-gray-300"><i class="fas fa-chevron-right"></i></div>
            </div>
        </a>
        <a href="cotizador.html" class="btn-tool group relative overflow-hidden rounded-2xl bg-white p-6 shadow hover:shadow-lg transition-all border-l-4 border-[#212B3B]">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 rounded-full bg-gray-100 flex items-center justify-center text-[#212B3B]"><i class="fas fa-calculator text-xl"></i></div>
                <div><h3 class="font-bold text-gray-900 text-lg">Cotizador Standard</h3><p class="text-xs text-gray-500 font-medium">Equipos y materiales base</p></div>
                <div class="ml-auto text-gray-300"><i class="fas fa-chevron-right"></i></div>
            </div>
        </a>
        <a href="cotizador_item.html" class="btn-tool group relative overflow-hidden rounded-2xl bg-white p-6 shadow hover:shadow-lg transition-all border-l-4 border-yellow-500">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 rounded-full bg-yellow-50 flex items-center justify-center text-yellow-600"><i class="fas fa-list-ol text-xl"></i></div>
                <div><h3 class="font-bold text-gray-900 text-lg">Cotizador por Ítem</h3><p class="text-xs text-gray-500 font-medium">Presupuestos detallados libres</p></div>
                <div class="ml-auto text-gray-300"><i class="fas fa-chevron-right"></i></div>
            </div>
        </a>
        <a href="mantenimiento.html" class="btn-tool group relative overflow-hidden rounded-2xl bg-white p-6 shadow hover:shadow-lg transition-all border-l-4 border-green-500">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 rounded-full bg-green-50 flex items-center justify-center text-green-600"><i class="fas fa-screwdriver-wrench text-xl"></i></div>
                <div><h3 class="font-bold text-gray-900 text-lg">Informe Mantenimiento</h3><p class="text-xs text-gray-500 font-medium">Multi-equipo, fotos e IA</p></div>
                <div class="ml-auto text-gray-300"><i class="fas fa-chevron-right"></i></div>
            </div>
        </a>
    </div>

    <div class="mt-12 text-center text-gray-400 text-[10px] font-medium uppercase tracking-wider">
        <p>Sistema EasyCool Cloud V10.0 | Sincronizado</p>
    </div>
</body>
</html>
