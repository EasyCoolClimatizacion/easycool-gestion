<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotización Simple - EasyCool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        @media print {
            body { background: white; margin:0; padding:0; }
            .no-print { display: none !important; }
            .printable { box-shadow: none !important; width: 100% !important; margin:0; }
            input, textarea { border:none!important; resize:none; font-family: 'Inter', sans-serif;}
        }
    </style>
</head>
<body class="p-4 sm:p-8 flex flex-col items-center">

    <div class="w-full max-w-[21.59cm] bg-white p-8 rounded-xl shadow-2xl printable relative mx-auto">
        <header class="flex justify-between items-start border-b-2 border-[#212B3B] pb-4 mb-6">
            <div class="flex flex-row items-center font-montserrat gap-4">
                <div class="relative w-[70px] h-[70px] bg-[#4981F3] rounded-full flex flex-col justify-center items-end pr-[12px] gap-[5px]">
                    <div class="h-[8px] w-[45px] bg-[#F1F6FF] rounded-full"></div>
                    <div class="h-[8px] w-[35px] bg-[#E4EEFF] rounded-full"></div>
                    <div class="h-[8px] w-[25px] bg-[#D2E3FF] rounded-full"></div>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-[#212B3B] font-[900] text-[24px] leading-none mb-1">EASYCOOL</h1>
                    <p class="text-[#9FA5B1] font-[500] text-[12px] leading-none">Climatización</p>
                </div>
            </div>
            <div class="text-right text-[#212B3B]">
                <h1 class="text-sm font-bold mb-1">EasyCool Climatización</h1>
                <p class="text-xs">RUT: 77.448.234-2</p>
                <p class="text-xs">ventas@easycoolclimatizacion.com</p>
                <p class="text-xs">+569 5777 6174</p>
            </div>
        </header>

        <div class="flex justify-between items-end mb-6">
            <div class="w-1/2">
                <input type="text" id="c-nombre" placeholder="Nombre Cliente" class="font-bold text-lg border-b w-full mb-1">
                <input type="text" id="c-rut" placeholder="RUT" class="text-sm text-gray-600 border-b w-full">
            </div>
            <div class="text-right">
                <p class="text-xs font-bold text-gray-500">COTIZACIÓN Nº</p>
                <input type="text" id="c-folio" value="EC-2026-01" class="text-right font-bold text-red-600 border w-24">
            </div>
        </div>

        <table class="w-full text-left border-collapse mb-4">
            <thead><tr class="bg-gray-200 text-xs uppercase"><th class="p-2">Descripción</th><th class="p-2 w-32 text-right">Monto Neto</th></tr></thead>
            <tbody id="items-body">
                <tr>
                    <td class="p-2 border-b"><input type="text" class="w-full border-none" value="Instalación Equipo Split"></td>
                    <td class="p-2 border-b"><input type="number" class="val-input w-full text-right border-none font-bold" value="120000" oninput="calc()"></td>
                </tr>
            </tbody>
        </table>
        <button onclick="addRow()" class="text-blue-500 text-xs font-bold no-print mb-6">+ Agregar Ítem</button>

        <div class="flex justify-end mb-6">
            <div class="w-1/3 text-right text-sm space-y-1">
                <p>Subtotal: <span id="t-sub" class="font-bold">$0</span></p>
                <p>IVA (19%): <span id="t-iva" class="font-bold">$0</span></p>
                <p class="text-lg font-bold text-blue-600 border-t pt-2">TOTAL: <span id="t-total">$0</span></p>
            </div>
        </div>

        <div class="mt-8 text-center no-print flex justify-center gap-4">
            <button id="save-print-btn" class="bg-gray-900 text-white font-bold py-2 px-6 rounded shadow-lg">Guardar en Nube & Imprimir</button>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDEdRinj3nsSy-xgkFAQBuABikw48vB92Y", authDomain: "easycool-cloud.firebaseapp.com", projectId: "easycool-cloud", storageBucket: "easycool-cloud.firebasestorage.app", messagingSenderId: "1088663353920", appId: "1:1088663353920:web:221585b4896c037dfbfda5" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    firebase.auth().signInAnonymously();

    function addRow() {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="p-2 border-b"><input type="text" class="w-full border-none" placeholder="Item"></td><td class="p-2 border-b"><input type="number" class="val-input w-full text-right border-none font-bold" value="0" oninput="calc()"></td>`;
        document.getElementById('items-body').appendChild(tr);
    }

    function calc() {
        let sub = 0;
        document.querySelectorAll('.val-input').forEach(i => sub += (parseFloat(i.value)||0));
        let iva = Math.round(sub * 0.19);
        let total = sub + iva;
        document.getElementById('t-sub').innerText = "$" + sub.toLocaleString('es-CL');
        document.getElementById('t-iva').innerText = "$" + iva.toLocaleString('es-CL');
        document.getElementById('t-total').innerText = "$" + total.toLocaleString('es-CL');
        return total;
    }
    calc();

    document.getElementById('save-print-btn').addEventListener('click', async () => {
        try {
            await db.collection('cotizaciones').add({
                cliente: document.getElementById('c-nombre').value,
                rut: document.getElementById('c-rut').value,
                folio: document.getElementById('c-folio').value,
                tipo: 'Simple', total: calc(), date: new Date().toISOString()
            });
        } catch(e) {}
        window.print();
    });
</script>
</body>
</html>
